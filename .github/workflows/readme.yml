name: Update README terminal

# Rebuilds the terminal picture every hour and on every push to main.
# The two SVGs are published to the `output` branch as a single commit that
# gets replaced each time, so main only ever changes when you change it.

on:
  schedule:
    - cron: "7 * * * *"   # every hour, at seven minutes past
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bring back the last known numbers
        run: |
          if git fetch --quiet --depth=1 origin output 2>/dev/null; then
            git show FETCH_HEAD:stats.json > stats.json 2>/dev/null || rm -f stats.json
          fi

      - name: Build dark.svg and light.svg
        run: python3 build.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish to the output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --quiet --orphan output
          git rm --quiet -r --cached .
          git add --force dark.svg light.svg stats.json
          git commit --quiet -m "Terminal as of $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --quiet --force origin output
