name: Update README terminal

on:
  schedule:
    - cron: "37 9 * * *"   # once a day, 09:37 UTC
  push:
    branches: [main]
    paths: [build.py, art.txt, .github/workflows/readme.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rebuild dark.svg and light.svg
        run: python3 build.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark.svg light.svg stats.json
          git diff --cached --quiet && exit 0
          git commit -m "Update terminal"
          git push
